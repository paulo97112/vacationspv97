name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Create Bubblewrap project
        run: |
          mkdir twa-app
          cd twa-app
          printf "n\n$JAVA_HOME\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n" | bubblewrap init --manifest https://spvvacation-35ac4jps.netlify.app/manifest.json --directory .
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: 'true'

      - name: Build APK
        run: |
          cd twa-app
          printf "\n\n\n\n" | bubblewrap build
        env:
          BUBBLEWRAP_SKIP_UPDATE_CHECK: 'true'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VacationsSPV
          path: twa-app/app-release-signed.apk
